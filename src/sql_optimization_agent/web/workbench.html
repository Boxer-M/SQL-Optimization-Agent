<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SQL 审核工作台</title>
<style>body{font:16px system-ui;margin:32px auto;max-width:1100px;padding:0 20px;color:#172238;background:#f5f7fb}section{background:white;padding:20px;border:1px solid #dce2ed;border-radius:10px;margin:16px 0}button,input,select,textarea{font:inherit;padding:9px;margin:5px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}textarea{display:block;width:90%;min-height:90px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf1f8;padding:12px}label{display:block}#message{white-space:pre-wrap;padding:12px}#message[data-error=true]{background:#ffe7e7;color:#8b1010}small{display:block;color:#536079}[hidden]{display:none!important}</style>
<h1>SQL 审核工作台</h1><p>审核只记录决定，不执行、替换或部署 SQL。</p>
<section><form id="login"><label>访问令牌 <input id="token" type="password" autocomplete="off" required></label><button>连接</button></form><span id="identity"></span><button id="logout" hidden>退出并清除</button><small>令牌仅保留在当前页面内存；刷新或关闭后需重新输入。</small></section>
<div id="message" role="status" aria-live="polite"></div>
<main id="workspace" hidden><section><h2>批次列表</h2><button id="refresh">刷新批次</button><div id="batches"></div><div id="upload" hidden><label>上传现有批次 JSON <input id="file" type="file" accept=".json,application/json"></label><button id="import">导入报告</button></div></section>
<section id="batch" hidden><h2>报告详情</h2><p id="batchId"></p><button id="download">下载原始 JSON</button><p id="checksum"></p><pre id="summary"></pre><label>选择条目 <select id="entries"></select></label><div id="evidence"></div><h3>审核历史</h3><p id="version"></p><pre id="history"></pre><form id="review" hidden><label>决定 <select id="decision"><option value="defer">暂缓</option><option value="accept">采纳</option><option value="reject">拒绝</option></select></label><label>理由 <textarea id="reason" required maxlength="4000"></textarea></label><button id="submit">提交决定</button><small>409 冲突后会刷新版本和历史、保留理由；请重新核对并再次点击提交，不会自动重试。</small></form></section></main>
<script src="/workbench/app.js" defer></script></html>

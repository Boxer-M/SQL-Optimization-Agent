name: Container image
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        run: python scripts/check_image_release.py
      - run: python -m pip install -e '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q
  smoke:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: amd64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sql-optimization-agent:smoke
          platforms: linux/${{ matrix.platform }}
      - name: Pull database image for Compose dependencies
        run: docker pull postgres:16
      - run: python scripts/smoke_compose.py --image sql-optimization-agent:smoke --report compose-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-${{ matrix.platform }}
          path: compose-smoke.json
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
      - name: Record immutable reference and source
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {key: os.environ[key] for key in ('IMAGE', 'DIGEST', 'SOURCE_SHA')}
          evidence['platforms'] = ['linux/amd64', 'linux/arm64']
          Path('image-release.json').write_text(json.dumps(evidence, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"Image: `{evidence['IMAGE']}@{evidence['DIGEST']}`\n\nSource: `{evidence['SOURCE_SHA']}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-release
          path: image-release.json

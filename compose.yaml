name: sql-optimization-agent

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sql_optimization
      POSTGRES_USER: sql_optimization_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sql_optimization_admin -d sql_optimization"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
    name: sql-optimization-agent-postgres-data
